tart;justify-content:unsafe center;width:108px;height:1px;padding-top:187px;margin-left:341px"><div style="box-sizing:border-box;font-size:0;text-align:center;color:#333"><div style="display:inline-block;font-size:14px;font-family:Helvetica;color:#333;line-height:1.2;pointer-events:all;font-weight:700;white-space:normal;word-wrap:normal">Crucible<br/>Ecosystem</div></div></div></foreignObject><text x="395" y="201" fill="#333" font-family="Helvetica" font-size="14" font-weight="bold" style="fill:#333" text-anchor="middle"><tspan x="395" y="201">Crucible</tspan><tspan x="395" y="218">Ecosystem</tspan></text></switch></g><g data-cell-id="p3-moat"><rect width="2190" height="240" x="90" y="1050" fill="#eceff1" stroke="#455a64" stroke-width="6" pointer-events="all" rx="36" ry="36" style="fill:#eceff1;stroke:#455a64"/><switch transform="scale(3)"><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe flex-start;justify-content:unsafe center;width:728px;height:1px;padding-top:362px;margin-left:31px"><div style="box-sizing:border-box;font-size:0;text-align:center;color:#37474f"><div style="display:inline-block;font-size:10px;font-family:Helvetica;color:#37474f;line-height:1.2;pointer-events:all;font-weight:700;white-space:normal;word-wrap:normal">The Structural Moat</div></div></div></foreignObject><text x="395" y="372" fill="#37474f" font-family="Helvetica" font-size="10" font-weight="bold" style="fill:#37474f" text-anchor="middle">The Structural Moat</text></switch></g><g data-cell-id="p3-m1"><path fill="none" d="M120 1134h2100v135H120z" pointer-events="all"/><switch transform="scale(3)"><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe flex-start;justify-content:unsafe flex-start;width:693px;height:1px;padding-top:385px;margin-left:47px"><div style="box-sizing:border-box;font-size:0;text-align:left;color:#37474f"><div style="display:inline-block;font-size:10px;font-family:Helvetica;color:#37474f;line-height:1.2;pointer-events:all;white-space:normal;word-wrap:normal">Requires THREE things simultaneously: a distribution system that tracks versions (Forge), a starter platform that versions skills (Starter), and a collection system that correlates usage (Ember). No single vendor can replicate this without building the entire ecosystem.</div></div></div></foreignObject><text x="47" y="395" fill="#37474f" font-family="Helvetica" font-size="10" style="fill:#37474f"><tspan x="47" y="395">Requires THREE things simultaneously: a distribution system that tracks versions (Forge), a starter platform that versions skills (Starter), and a collection</tspan><tspan x="47" y="407">system that correlates usage (Ember). No single vendor can replicate this without building the entire ecosystem.</tspan></text></switch></g><g data-cell-id="p3-punch"><path fill="none" d="M135 1335h2100v135H135z" pointer-events="all"/><switch transform="scale(3)"><foreignObject width="100%" height="100%" pointer-events="none" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:unsafe flex-start;justify-content:unsafe center;width:698px;height:1px;padding-top:452px;margin-left:46px"><div style="box-sizing:border-box;font-size:0;text-align:center;color:#2d7600"><div style="display:inline-block;font-size:13px;font-family:Helvetica;color:#2d7600;line-height:1.2;pointer-events:all;font-weight:700;font-style:italic;white-space:normal;word-wrap:normal">“Ember is the only tool that knows what version of a skill your developers are actually using,<br/>not just whether it’s installed, but whether it’s being invoked, and whether it’s safe to deprecate.”</div></div></div></foreignObject><text x="395" y="465" fill="#2d7600" font-family="Helvetica" font-size="13" font-style="italic" font-weight="bold" style="fill:#2d7600" text-anchor="middle"><tspan x="395" y="465">“Ember is the only tool that knows what version of a skill your developers are actually using,</tspan><tspan x="395" y="481">not just whether it’s installed, but whether it’s being invoked, and whether it’s safe to deprecate.”</tspan></text></switch></g></g></g></svg>