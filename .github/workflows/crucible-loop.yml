# Crucible delivery loop. Logic lives in crucibledx/factory-loop; keep this file thin.
name: Crucible loop

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths: ["specs/**"]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
  checks: read

jobs:
  mention:
    if: contains(fromJSON('["issue_comment","pull_request_review_comment","pull_request_review"]'), github.event_name)
    uses: crucibledx/factory-loop/.github/workflows/loop-mention.yml@v0
    secrets: inherit

  # Required by the main-branch ruleset: fails while blocking review threads are unresolved.
  # Submitted reviews only re-check the gate (no model run).
  review:
    if: contains(fromJSON('["pull_request","pull_request_review"]'), github.event_name)
    uses: crucibledx/factory-loop/.github/workflows/loop-review.yml@v0
    secrets: inherit

  # Your approval of the head turns on auto-merge; GitHub merges once the ruleset's checks and conversations are
  # satisfied. A new push turns it off until you approve the new head.
  automerge:
    if: >-
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'pull_request' && github.event.action == 'synchronize')
    uses: crucibledx/factory-loop/.github/workflows/loop-automerge.yml@v0
    secrets: inherit

  specs:
    if: github.event_name == 'push'
    uses: crucibledx/factory-loop/.github/workflows/loop-spec-merged.yml@v0
    secrets: inherit
